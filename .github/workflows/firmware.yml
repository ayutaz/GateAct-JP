name: Firmware (ESP32-S3)

# 実機への書き込みは行わない。ビルドとサイズ記録のみ。
on:
  pull_request:
    paths:
      - "firmware/**"
      - "src/gateact/export/**"
      - "src/gateact/features/**"
      - "scripts/gen_firmware_model.py"
      - ".github/workflows/firmware.yml"
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "src/gateact/export/**"
      - "src/gateact/features/**"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: [xor, gateact]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Generate model sources
        run: uv run python scripts/gen_firmware_model.py ${{ matrix.project == 'gateact' && 'gateact-smoke' || matrix.project }}
      - name: Build with ESP-IDF v5.5
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v5.5
          target: esp32s3
          path: firmware/esp32s3/${{ matrix.project }}
          command: idf.py build && idf.py size --format json2 --output-file build/size.json
      - name: Size summary
        run: |
          ls -l firmware/esp32s3/${{ matrix.project }}/build/*.bin
          head -c 2000 firmware/esp32s3/${{ matrix.project }}/build/size.json || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.project }}-esp32s3
          path: |
            firmware/esp32s3/${{ matrix.project }}/build/*.bin
            firmware/esp32s3/${{ matrix.project }}/build/bootloader/bootloader.bin
            firmware/esp32s3/${{ matrix.project }}/build/partition_table/partition-table.bin
            firmware/esp32s3/${{ matrix.project }}/build/flash_args
            firmware/esp32s3/${{ matrix.project }}/build/size.json
            firmware/esp32s3/${{ matrix.project }}/main/model/model_info.json
          retention-days: 30
