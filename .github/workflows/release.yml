name: Release

# v* タグで全チェックを通したうえで、GitHub Release を「下書き」で作成する。
# 下書きを公開するのは人が成果物と検証結果を確認してから。PyPI / Hugging Face には公開しない。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  firmware:
    uses: ./.github/workflows/firmware.yml

  release:
    needs: [ci, firmware]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: firmware-*
          path: release-assets/
      - name: Package reproducibility assets
        run: |
          mkdir -p release-assets
          cp uv.lock pyproject.toml release-assets/
          [ -d results ] && tar czf release-assets/results.tar.gz results configs || true
          (cd release-assets && for d in firmware-*/; do tar czf "${d%/}.tar.gz" "$d"; rm -rf "$d"; done)
          ls -l release-assets dist
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* release-assets/* \
            --draft --generate-notes --title "GateAct-JP $GITHUB_REF_NAME"
